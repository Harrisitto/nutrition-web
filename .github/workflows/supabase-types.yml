name: Generate Supabase Types

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-supabase-types:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Generate Supabase types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --yes supabase gen types typescript --project-id iivsjutltecehnnhmjok > src/services/supabase/types.ts
